# Optional MobileAndroid flavor API roots (full URL with trailing slash). Defaults are in app/build.gradle.kts.
#
# Flavors: prod + tunnelBeta → app.eliteew.ru; stage → app-staging.eliteew.ru.
# Override only for a dedicated staging/lab host, still prefer https://:
#   mobile.android.stage.baseUrl=https://app-staging.eliteew.ru/api/v1/
#   mobile.android.prod.baseUrl=https://app.eliteew.ru/api/v1/
#   mobile.android.tunnelBeta.baseUrl=https://app.eliteew.ru/api/v1/
# Prefer putting overrides in local.properties (gitignored); see app/build.gradle.kts mobileFlavorBaseUrl.
#
# If `./gradlew` uses the wrong JDK, set Daemon JVM explicitly (Gradle reads this — not sdk.dir).
# Matches Android Studio: <android-studio-dir>/jbr  (JDK 21). Example:
# org.gradle.java.home=/home/owned/android-studio/jbr

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official
