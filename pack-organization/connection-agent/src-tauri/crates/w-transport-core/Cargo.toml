[package]
name = "w-transport-core"
version = "0.1.0"
edition = "2021"
description = "EliteEW FoFline W-transport (userspace SOCKS + boringtun + smoltcp TCP-over-WG)"
authors = ["po&T && TZBrand"]
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
boringtun = { version = "0.7.1", default-features = false }
mio = { version = "1", features = ["os-poll", "net"] }
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
