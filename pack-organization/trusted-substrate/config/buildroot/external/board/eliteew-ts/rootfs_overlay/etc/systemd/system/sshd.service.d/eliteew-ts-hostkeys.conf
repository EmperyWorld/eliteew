# OpenSSH refuses to start when host keys are not root-owned (common after
# pack-as-user tarball extract). Heal before ssh-keygen -A / sshd.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'chown root:root /etc/ssh/ssh_host_* 2>/dev/null || true; chmod 600 /etc/ssh/ssh_host_*_key 2>/dev/null || true; chmod 644 /etc/ssh/ssh_host_*.pub 2>/dev/null || true; exec /usr/bin/ssh-keygen -A'
