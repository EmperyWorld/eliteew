[Unit]
# During reboot/halt do not respawn getty → installer/kiosk race after Done.
Conflicts=reboot.target halt.target poweroff.target shutdown.target
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
# Real PAM seat on tty1 — required for labwc/wlroots. No password prompt.
ExecStart=
ExecStart=-/sbin/agetty --noclear --autologin eliteew-ts --keep-baud 115200,38400,9600 %I $TERM
Type=idle
# A clean router exit is intentional recovery/disable behavior. Repeated
# failures are bounded so compositor defects cannot create a visual boot storm.
Restart=on-failure
RestartSec=3
