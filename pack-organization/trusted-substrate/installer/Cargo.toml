# EliteEW Trusted Substrate — first-party disk installer (MIT).
# Third-party crates used under MIT (or dual MIT/Apache-2.0 choosing MIT).
# Built only from source — no vendored prebuilt installer binaries.

[package]
name = "eliteew-ts-installer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "EliteEW Trusted Substrate live-media disk installer"
publish = false
authors = ["Empery World / EliteEW"]

[dependencies]
# egui/eframe: MIT OR Apache-2.0 — we use MIT; no default_fonts (non-MIT pack)
eframe = { version = "0.31", default-features = false, features = [
  "glow",
  "wayland",
  "x11",
  "__screenshot",
] }
egui = { version = "0.31", default-features = false }
egui_extras = { version = "0.31", default-features = false, features = ["image"] }
# image: MIT OR Apache-2.0 — PNG only; pin below factory rustc 1.82 ceiling
image = { version = "=0.25.6", default-features = false, features = ["png"] }

# Factory Buildroot host cargo/rustc is 1.82. Direct pins keep Cargo.lock free of
# edition2024 / resolver="3" / rust-version>1.82 manifests (cargo must parse every
# lock entry, including foreign-target transitive crates).
idna_adapter = "=1.1.0"
jobserver = "=0.1.34"
indexmap = "=2.13.1"
hashbrown = "=0.15.5"
getrandom = "=0.3.3"
wasi = "=0.14.4"
proc-macro-crate = "=3.3.0"
toml_edit = "=0.22.24"
toml_datetime = "=0.6.8"
libredox = "=0.1.10"
redox_syscall = "=0.5.18"
# Foreign-target ceilings only (optional → resolve into lock, do not build on Linux).
android-activity = { version = "=0.6.0", optional = true }
jni = { version = "=0.21.1", optional = true }
simd_cesu8 = { version = "=1.0.1", optional = true }
smithay-clipboard = "=0.7.2"
tiff = "=0.11.0"
unicode-segmentation = "=1.12.0"
wayland-protocols = "=0.32.6"
webbrowser = "=1.0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
