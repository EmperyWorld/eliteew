# Host-level Nginx: TLS терминация для офлайн *.eliteew.ru
# Сертификаты: положи fullchain.pem и privkey.pem в ssl_certificate путь (см. ниже).
# Копировать: sudo cp docker/conf.d/offline-empery.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
#
# Без client_max_body_size дефолт nginx = 1m → 413 на POST /api/v1/content и т.п. (см. docker/host_conf/nginx-app-https.conf).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name app.eliteew.ru auth.eliteew.ru admin.eliteew.ru meet.eliteew.ru eliteew.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name ~^(?<site_label>[a-z0-9-]+)-site\.eliteew\.ru$;
    return 301 https://$host$request_uri;
}

# eliteew.ru (apex) — только редирект на app, приложение не отдаём
server {
    listen 443 ssl;
    http2 on;
    server_name eliteew.ru;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header X-Content-Type-Options "nosniff" always;
    location / {
        return 301 https://app.eliteew.ru$request_uri;
    }
}

# App (SPA + API proxy внутри контейнера)
server {
    listen 443 ssl;
    http2 on;
    server_name app.eliteew.ru;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 100M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:29001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Wildcard user sites -> Site Studio public gateway in API.
# Interim product hosts {slug}-site.eliteew.ru — covered by existing *.eliteew.ru leaf.
server {
    listen 443 ssl;
    http2 on;
    server_name ~^(?<site_label>[a-z0-9-]+)-site\.eliteew\.ru$;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 100M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:29000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# OIDC IdP (auth + admin) — управляем frame/policy заголовками на reverse-proxy
server {
    listen 443 ssl;
    http2 on;
    server_name auth.eliteew.ru;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    location / {
        # oauth4webapi (SPA на app.eliteew.ru): discovery + token POST + refresh — cross-origin fetch.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://app.eliteew.ru" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Language" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_pass http://127.0.0.1:36000;
        proxy_http_version 1.1;
        proxy_set_header Host auth.eliteew.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        add_header Access-Control-Allow-Origin "https://app.eliteew.ru" always;
        add_header Vary "Origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://admin.eliteew.ru https://auth.eliteew.ru" always;
    }
}

# admin → редирект на auth (один hostname для админки, иначе "Loading..." бесконечно)
server {
    listen 443 ssl;
    http2 on;
    server_name admin.eliteew.ru;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header X-Content-Type-Options "nosniff" always;

    location / {
        return 301 https://auth.eliteew.ru$request_uri;
    }
}

# Meet (Jitsi) — напрямую в Jitsi web (stack11, порт 34002).
# Использует тот же offline-empery fullchain.pem (mkcert wildcard / SAN для *.eliteew.ru).
server {
    listen 443 ssl;
    http2 on;
    server_name meet.eliteew.ru;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    set $meet_jitsi_upstream http://127.0.0.1:34002;
    include /etc/nginx/conf.d/eliteew-meet-server.inc;
}
