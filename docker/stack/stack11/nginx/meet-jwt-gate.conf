# EliteEW · Meet JWT gate (sidecar nginx in front of jitsi/web)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $meet_jitsi_upstream http://web:80;
    include /etc/nginx/meet-locations.inc;
}
