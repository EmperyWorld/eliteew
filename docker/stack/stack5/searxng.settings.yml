# SearXNG — stack5 сейчас не поднимается; файл оставлен для справки / будущего включения.
# Раньше: монтировался из docker/stack/stack5.yml.
#
# Google/Brave с IP Docker-сети часто: access denied / too many requests.
# Включены движки без API-ключей; у Wikipedia включён list — строки попадают в JSON results
# (не только infobox), что критично для клиента EliteEW.
# Bing для ru часто шумит, но без него при DDG CAPTCHA / Mojeek ban почти нет выдачи — оставляем с низким weight.
# EliteEW в search_service отсекает хиты без пересечения токенов с запросом (+ whitelist wiki/wikidata).

use_default_settings: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  # Generate a unique secret before deployment.
  secret_key: "CHANGE_ME_BEFORE_DEPLOYMENT"
  limiter: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
  ban_time_on_fail: 3
  max_ban_time_on_fail: 90

outgoing:
  request_timeout: 18.0
  max_request_timeout: 28.0
  pool_connections: 100
  pool_maxsize: 20

engines:
  - name: startpage
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true

  - name: google
    disabled: true
  - name: google images
    disabled: true
  - name: google news
    disabled: true
  - name: google videos
    disabled: true
  - name: google scholar
    disabled: true
  - name: google play apps
    disabled: true
  - name: google play movies
    disabled: true

  - name: brave
    disabled: true
  - name: brave.images
    disabled: true
  - name: brave.videos
    disabled: true
  - name: brave.news
    disabled: true

  - name: duckduckgo
    engine: duckduckgo
    timeout: 22.0
    weight: 2.5

  - name: bing
    disabled: false
    timeout: 16.0
    weight: 0.28

  - name: mojeek
    disabled: false
    timeout: 14.0
    weight: 2.1

  - name: mwmbl
    disabled: false
    timeout: 10.0
    weight: 0.22

  # На многих IP отвечает access denied — не тратим слот
  - name: qwant
    disabled: true

  - name: wikipedia
    display_type: ["infobox", "list"]
    timeout: 10.0
    weight: 2.6

  - name: wikidata
    timeout: 8.0
    weight: 2.0
