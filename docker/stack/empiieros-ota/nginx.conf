# EmpiierOS OTA edge nginx — baked into image (no host config bind required).
# Capsule tree: /srv/empiieros-ota (tmpfs). Empty = health ok, current absent.
# VIP front strips /empiieros-ota/ → this server sees /v1/...

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    server {
        listen 80;
        server_name _;
        root /srv/empiieros-ota;

        location = /health {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok\n";
        }

        # E2c: portal-path trust day-1. POST only. Empty tmpfs → no_capsule.
        location = /v1/attest {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            limit_except POST {
                deny all;
            }
            if (-f /srv/empiieros-ota/current.json) {
                return 200 '{"ok":true,"grant":"portal_path_v1","capsule_href":"/empiieros-ota/v1/current.json"}\n';
            }
            return 404 '{"error":"no_capsule"}\n';
        }

        location = /v1/current.json {
            default_type application/json;
            add_header Cache-Control "no-store";
            root /srv/empiieros-ota;
            try_files /current.json =404;
        }

        location = /v1/no_capsule {
            default_type application/json;
            add_header Cache-Control "no-store";
            return 404 '{"error":"no_capsule"}\n';
        }

        # Blobs only after CP push into tmpfs. Deny listing.
        location /v1/blobs/ {
            alias /srv/empiieros-ota/blobs/;
            default_type application/octet-stream;
            add_header Cache-Control "no-store";
            autoindex off;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
