worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    map $uri $apk_filename {
        default "empery-mobile.apk";
    }

    server {
        listen 80;
        server_name _;

        root /srv/mobile-release;
        client_max_body_size 1m;

        location = /health {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok\n";
        }

        location = /v1/manifest.json {
            alias /srv/mobile-release/empery-mobile.manifest.json;
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
        }

        location = /v1/empery-mobile.apk {
            alias /srv/mobile-release/empery-mobile.apk;
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "public, max-age=300";
        }

        location = /v1/app-prod-release.apk {
            alias /srv/mobile-release/app-prod-release.apk;
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "public, max-age=300";
        }
    }
}
