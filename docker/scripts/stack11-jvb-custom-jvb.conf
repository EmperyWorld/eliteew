# EliteEW · JVB host-network overrides (included last from jvb.conf).
# - public :19090 — colibri-ws (cockpit owns host :9090); nginx → host.containers.internal IP
# - private :8080 on loopback — healthcheck; avoid clash with stack2-llama-chat on LAN :8080
videobridge {
    apis {
        rest {
            enabled = true
        }
    }
    http-servers {
        private {
            host = 127.0.0.1
            port = 8080
            send-server-version = false
        }
        public {
            host = 0.0.0.0
            port = 19090
            send-server-version = false
        }
    }
}
