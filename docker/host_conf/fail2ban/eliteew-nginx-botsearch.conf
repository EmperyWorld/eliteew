# Purpose:
# Edge fail2ban filter for residual nginx scanner 404s (access.log file backend).
# Invariants:
# - No journalmatch — jail must use backend=polling|pyinotify against access.log.
# - Broader WordPress paths than stock nginx-botsearch (wp-admin/…, xmlrpc.php).
# - Primary CMS defense remains nginx return 444 (never ban Cloudflare edge IPs for those probes).
# Related:
# - docker/scripts/yandex-tunnel/yandex-tunnel-security-monitor.sh
# - documentation/platform/docker-re_doc/YANDEX-VM-SSH-TUNNEL.md
# ---

[Definition]

# Stock nginx-botsearch badbots + EliteEW CMS path coverage.
badbots = roundcube|(ext)?mail|horde|(v-?)?webmail|(typo3/|xampp/|admin/|)(pma|(php)?[Mm]y[Aa]dmin)|wp-(login|signup|admin)(\.php|/)|xmlrpc\.php|cgi-bin|mysqladmin

failregex = ^<HOST> \- \S+ \[\] \"(GET|POST|HEAD) \/\/*(?:%(badbots)s)[^,]* \S+\" 404 .+$
            ^ \[error\] \d+#\d+: \*\d+ (\S+ )?\"\S+\" (failed|is not found) \(2\: No such file or directory\), client\: <HOST>\, server\: \S*\, request: \"(GET|POST|HEAD) \/\/*(?:%(badbots)s)[^,]* \S+\"\, .*?$

ignoreregex =

# Intentionally empty: file logpath + backend=polling in jail (not systemd journal).
journalmatch =
