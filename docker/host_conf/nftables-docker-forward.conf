# Фрагмент для chain forward — вставить в /etc/nftables.conf вместо одного "drop".
# nftables с forward { drop } режет весь трафик между контейнерами Docker.
# Разрешаем: established/related, трафик через мосты Docker (br-*, docker0).

    chain forward {
        type filter hook forward priority 0;

        # Уже установленные соединения (ответы)
        ct state established,related accept

        # Трафик между контейнерами Docker (мосты br-* и docker0)
        iifname "docker0" accept
        oifname "docker0" accept
        iifname "br-*" accept
        oifname "br-*" accept

        # Всё остальное — по умолчанию отбрасываем (как было)
        drop
    }
