limit_req_zone $binary_remote_addr zone=landing_gate:10m rate=120r/m;

server {
    listen 80;
    server_name eliteew.ru www.eliteew.ru assets.eliteew.ru;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eliteew.ru www.eliteew.ru assets.eliteew.ru;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Content-Security-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), fullscreen=(self), picture-in-picture=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Next.js App Router (site_prod) + Framer Motion: inline bootstrap scripts + runtime styles.
    # Legacy static landing used script/style 'self' only; that breaks RSC hydration and motion.
    # form-action 'self' — native forms; lead funnel uses fetch POST /api/lead (same-origin).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests; block-all-mixed-content" always;

    if ($arg_url) {
        return 404;
    }

    if ($arg_dest) {
        return 404;
    }

    location = /health {
        access_log off;
        limit_except GET HEAD { deny all; }
        default_type text/plain;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), fullscreen=(self), picture-in-picture=(self)" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests; block-all-mixed-content" always;
        return 200 "healthy\n";
    }

    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location ~* ^/(?:api/)?(?:fetch|proxy) { return 404; }
    # CMS/tooling probes: close without response (do not 404 — avoids fail2ban on Cloudflare edges).
    location ~* (?:/[^/]*\.env(?:\.[^/]*)?(?:\?|$)|/[^/]*env\.js(?:\?|$)|/(?:\.env|\.git|\.svn|\.hg|wp-admin|wp-login\.php|wp-config|xmlrpc\.php|composer\.|serverless\.|\.aws|\.docker|\.vscode|actuator|_profiler|debug|phpmyadmin|server-status|server-info)(?:/|\?|$)) {
        return 444;
    }

    # Lead funnel: Next route POST /api/lead (JSON). Keep probe /api/fetch|/proxy blocked above.
    location = /api/lead {
        limit_req zone=landing_gate burst=20 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://eliteew_landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=landing_gate burst=60 nodelay;
        limit_except GET HEAD { deny all; }
        proxy_pass http://eliteew_landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
