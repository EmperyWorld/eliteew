# Variant of nginx-auth-vm.conf for the current Yandex VM edge:
# the wildcard EliteEW certificate is stored at /etc/nginx/ssl/offline-empery
# and covers auth.eliteew.ru via DNS:*.eliteew.ru.
#
# Public client flow:
#   browser -> https://auth.eliteew.ru
#   VM nginx -> 127.0.0.1:36000
#   reverse SSH tunnel -> stack6-keycloak on punisher.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_origin $auth_cors_origin {
    default "";
    "https://app.eliteew.ru" $http_origin;
}

server {
    listen 80;
    server_name auth.eliteew.ru admin.eliteew.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name auth.eliteew.ru;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $auth_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Language" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_pass http://eliteew_auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host auth.eliteew.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host auth.eliteew.ru;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        add_header Access-Control-Allow-Origin $auth_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://admin.eliteew.ru https://auth.eliteew.ru" always;
    }
}

server {
    listen 443 ssl http2;
    server_name admin.eliteew.ru;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        return 301 https://auth.eliteew.ru$request_uri;
    }
}
