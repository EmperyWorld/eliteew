# Как docker/host_conf/nginx-app-https.conf, но TLS: та же пара, что на домашнем nginx (mkcert ~/.eliteew.ru).
# На VM файлы должны лежать в /etc/nginx/ssl/offline-empery/{fullchain,privkey}.pem
# (скрипт: docker/scripts/yandex-tunnel/sync-mkcert-certs-to-yandex-vm.sh).
# Внимание: цепочка доверия — локальный mkcert CA; публичные браузеры без вашего CA покажут предупреждение.
#
# WebSocket: Upgrade/Connection to backhaul upstreams (WG primary or SSH reserve).
# Upstreams: /etc/nginx/conf.d/00-eliteew-backhaul-upstreams.conf (deploy via wg-backhaul).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format eliteew_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

# Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name app.eliteew.ru;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# Soft-retired DEWA / EWPower — no backhaul; honest closed (not 502 / not OTA :29180).
server {
    listen 80;
    server_name power.eliteew.ru dewa.eliteew.ru;
    server_tokens off;

    return 410;
}

server {
    listen 80;
    server_name ~^(?<site_label>[a-z0-9-]+)-site\.eliteew\.ru$;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name meet.eliteew.ru;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name app.eliteew.ru;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Jitsi is embedded from meet.eliteew.ru inside app.eliteew.ru.
    # Do not set camera/microphone=(): browsers (notably Meta Quest Browser) then
    # block getUserMedia in the child frame before showing the permission prompt.
    add_header Permissions-Policy "accelerometer=(), camera=(self \"https://meet.eliteew.ru\"), geolocation=(), gyroscope=(), microphone=(self \"https://meet.eliteew.ru\"), payment=(), usb=(), fullscreen=(self \"https://meet.eliteew.ru\"), display-capture=(self \"https://meet.eliteew.ru\"), screen-wake-lock=(self \"https://meet.eliteew.ru\"), picture-in-picture=(self \"https://meet.eliteew.ru\")" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    client_max_body_size 100M;
    client_body_timeout 300s;

    error_page 502 503 504 /eliteew-maintenance.html;

    location = /eliteew-maintenance.html {
        root /var/www;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    if ($arg_url) {
        return 404;
    }

    if ($arg_dest) {
        return 404;
    }

    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /env { return 404; }
    # Exact env.js probe only — never ~* …env.js (Vite chunks like *BF5AJEnv.js matched case-insensitively).
    location = /env.js { return 404; }
    location ~ /(^|/)env\.js$ { return 404; }
    location = /swagger { return 404; }
    location = /swagger.json { return 404; }
    location = /nginx_status { return 404; }
    location = /runtime-config.json { return 404; }
    location = /__vite_ping { return 404; }
    location = /deployment-manifest.json { return 404; }
    location = /actuator { return 404; }
    location = /actuator/env { return 404; }
    location = /server-status { return 404; }
    location = /api/v1/desktop-client/air-enroll/ws { return 404; }
    location ~* ^/(?:api/)?(?:fetch|proxy) { return 404; }
    # CMS/tooling probes: close without response (do not 404 — avoids fail2ban on Cloudflare edges).
    location ~* (?:/[^/]*\.env(?:\.[^/]*)?(?:\?|$)|/(?:\.env|\.git|\.svn|\.hg|wp-admin|wp-login\.php|wp-config|xmlrpc\.php|composer\.|serverless\.|\.aws|\.docker|\.vscode|actuator|_profiler|debug|phpmyadmin|server-status|server-info)(?:/|\?|$)) {
        return 444;
    }

    location ^~ /api/ {
        proxy_pass http://eliteew_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ^~ /socket.io/ {
        proxy_pass http://eliteew_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # EmpiierOS capsule OTA — WG backhaul to prod-core :29181 (not app_upstream).
    location ^~ /empiieros-ota/ {
        proxy_pass http://eliteew_empiieros_ota_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 2m;
    }

    location / {
        proxy_intercept_errors on;
        proxy_pass http://eliteew_app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Soft-retired DEWA / EWPower — TLS terminates here, no proxy to backhaul/OTA.
server {
    listen 443 ssl http2;
    server_name power.eliteew.ru dewa.eliteew.ru;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    return 410;
}

# Jitsi Meet (stack11 на punisher): туннель stack-yandex-tunnel — RemoteForward 13402 → 127.0.0.1:34002.
# Не добавлять X-Frame-Options SAMEORIGIN: иначе EliteEW iframe с app.eliteew.ru не встроит Meet.
server {
    listen 443 ssl http2;
    server_name meet.eliteew.ru;
    server_tokens off;
    access_log /var/log/nginx/meet.access.log eliteew_noquery;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;
    client_body_timeout 300s;

    include /etc/nginx/conf.d/01-eliteew-meet-upstream-set.inc;
    include /etc/nginx/conf.d/eliteew-meet-server.inc;
}

# Wildcard user sites -> API gateway на punisher (через туннель 29000 при необходимости).
server {
    listen 443 ssl http2;
    server_name ~^(?<site_label>[a-z0-9-]+)-site\.eliteew\.ru$;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/offline-empery/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/offline-empery/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://eliteew_sites_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
