# Like nginx-app-https.conf, but app.eliteew.ru serves cloud browser SPA from edge disk.
# Enable: deploy-cloud-spa-to-edge.sh --enable-nginx (prod Let's Encrypt on edge VM).
# Static root: /srv/eliteew/cloud-spa/current — see documentation/platform/CLOUD-SPA-EDGE-STATIC.md
#
# WebSocket: Upgrade/Connection to backhaul upstreams (WG primary or SSH reserve).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name app.eliteew.ru;
    return 301 https://$host$request_uri;
}

# Soft-retired DEWA / EWPower — no backhaul; honest closed (not 502 / not OTA).
server {
    listen 80;
    server_name power.eliteew.ru dewa.eliteew.ru;
    return 410;
}

server {
    listen 80;
    # Interim product hosts under cert *.eliteew.ru (not *.sites.eliteew.ru).
    server_name ~^(?<site_label>[a-z0-9-]+)-site\.eliteew\.ru$;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name meet.eliteew.ru;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name app.eliteew.ru;
    ssl_certificate     /etc/letsencrypt/live/app.eliteew.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.eliteew.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Jitsi is embedded from meet.eliteew.ru inside app.eliteew.ru.
    # Keep camera/microphone available to the child frame; otherwise some browsers
    # block getUserMedia before showing the permission prompt.
    add_header Permissions-Policy "accelerometer=(), camera=(self \"https://meet.eliteew.ru\"), geolocation=(), gyroscope=(), microphone=(self \"https://meet.eliteew.ru\"), payment=(), usb=(), fullscreen=(self \"https://meet.eliteew.ru\"), display-capture=(self \"https://meet.eliteew.ru\"), screen-wake-lock=(self \"https://meet.eliteew.ru\"), picture-in-picture=(self \"https://meet.eliteew.ru\")" always;

    # Без этой директивы у nginx по умолчанию 1m → 413 на /api/v1/content и др. загрузках.
    # Должно быть согласовано с shared/web/frontend/nginx.prod.conf (там 100M).
    client_max_body_size 100M;
    client_body_timeout 300s;

    error_page 502 503 504 /eliteew-maintenance.html;

    location = /eliteew-maintenance.html {
        root /var/www;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    # Scanner / disclosure probes — 404 before SPA/API proxy (defense in depth vs FE).
    location = /env { return 404; }
    # Exact env.js probe only — never ~* …env.js (Vite chunks like *BF5AJEnv.js matched case-insensitively).
    location = /env.js { return 404; }
    location ~ /(^|/)env\.js$ { return 404; }
    location = /swagger { return 404; }
    location = /swagger.json { return 404; }
    location = /nginx_status { return 404; }
    location = /runtime-config.json { return 404; }
    location = /__vite_ping { return 404; }
    location = /deployment-manifest.json { return 404; }
    location = /actuator { return 404; }
    location = /actuator/env { return 404; }
    location = /server-status { return 404; }
    location = /openapi.json { return 404; }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location ~* ^/(?:api/)?(?:fetch|proxy) { return 404; }
    # CMS/tooling probes: close without response (do not 404 — avoids fail2ban on Cloudflare edges).
    location ~* (?:/[^/]*\.env(?:\.[^/]*)?(?:\?|$)|/(?:\.env|\.git|\.svn|\.hg|wp-admin|wp-login\.php|wp-config|xmlrpc\.php|composer\.|serverless\.|\.aws|\.docker|\.vscode|actuator|_profiler|debug|phpmyadmin|server-status|server-info)(?:/|\?|$)) {
        return 444;
    }

    # Air enrollment is served only on the dedicated high-port listener.
    location = /api/v1/desktop-client/air-enroll/ws { return 404; }

    # Cloud browser SPA (static on edge; API/socket via WG → :29000).
    include /etc/nginx/conf.d/eliteew-app-cloud-spa-locations.inc;
}

# Soft-retired DEWA / EWPower — TLS terminates here, no proxy to backhaul/OTA.
server {
    listen 443 ssl http2;
    server_name power.eliteew.ru dewa.eliteew.ru;
    ssl_certificate     /etc/letsencrypt/live/app.eliteew.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.eliteew.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    return 410;
}

# Meet continues below — do not merge into retired hosts.

# Meet upstream follows /etc/eliteew-backhaul-mode via 01-eliteew-meet-upstream-set.inc
# (wg → 10.77.77.2:13402, ssh reserve → 127.0.0.1:13402). Do not hardcode the reserve port.
# Meet UI: JWT gate — docker/host_conf/nginx-meet-server.inc (copy onto the VM with this server).
server {
    listen 443 ssl http2;
    server_name meet.eliteew.ru;
    ssl_certificate     /etc/letsencrypt/live/app.eliteew.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.eliteew.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;
    client_body_timeout 300s;

    include /etc/nginx/conf.d/01-eliteew-meet-upstream-set.inc;
    include /etc/nginx/conf.d/eliteew-meet-server.inc;
}

# Wildcard user sites -> Site Studio public gateway in API.
# Interim: {slug}-site.eliteew.ru covered by existing *.eliteew.ru / app.eliteew.ru leaf.
# Explicit app/auth/meet server_name blocks stay more specific and win.
# Future DNS-01 *.sites.eliteew.ru cutover remains deferred.
server {
    listen 443 ssl http2;
    server_name ~^(?<site_label>[a-z0-9-]+)-site\.eliteew\.ru$;
    ssl_certificate     /etc/letsencrypt/live/app.eliteew.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.eliteew.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:29000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
