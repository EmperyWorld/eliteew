# На VM в Yandex: auth.eliteew.ru и admin.eliteew.ru -> Keycloak stack6.
# Порт в proxy_pass ниже ДОЛЖЕН совпадать с KEYCLOAK_HOST_PORT в docker/env_file/.env.stack6 (часто 36000; иначе — 502).
# ВАЖНО: auth.eliteew.ru должен идти через этот nginx (не напрямую на 36010), иначе локальный origin будет неконсистентен
# отдаёт X-Frame-Options: sameorigin и админка пишет "Refused to display in a frame".
# Разместить: /etc/nginx/sites-available/auth.eliteew.ru
# После certbot: sudo ln -sf .../sites-available/auth.eliteew.ru .../sites-enabled/
#               sudo certbot --nginx -d auth.eliteew.ru -d admin.eliteew.ru --non-interactive --agree-tos --register-unsafely-without-email

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_origin $auth_cors_origin {
    default "";
    "https://app.eliteew.ru" $http_origin;
}

# HTTP default (localhost, IP и т.д.) — редирект на HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP: проверка certbot (/.well-known) и редирект остального на HTTPS
server {
    listen 80;
    server_name auth.eliteew.ru admin.eliteew.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — auth (OIDC login)
# ОБЯЗАТЕЛЬНО: задаём frame-ancestors для встроенных сценариев админки
# (особенно при открытии с admin.eliteew.ru) пишет "Refused to display in a frame".
server {
    listen 443 ssl;
    server_name auth.eliteew.ru;
    ssl_certificate     /etc/letsencrypt/live/auth.eliteew.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.eliteew.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Управляем frame/policy заголовками на уровне reverse-proxy
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    location / {
        # SPA EliteEW (app.eliteew.ru): oauth4webapi — discovery + token + refresh через fetch.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $auth_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Accept-Language" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;

        proxy_pass http://127.0.0.1:36000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;
        add_header Access-Control-Allow-Origin $auth_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://admin.eliteew.ru https://auth.eliteew.ru" always;
    }
}

# HTTPS — admin. Редирект на auth единый вход
# hostname для auth и admin — иначе Admin UI бесконечно "Loading...".
server {
    listen 443 ssl;
    server_name admin.eliteew.ru;
    ssl_certificate     /etc/letsencrypt/live/auth.eliteew.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.eliteew.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        return 301 https://auth.eliteew.ru$request_uri;
    }
}
