services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: ollenti-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - '31111:80'
    depends_on:
      - api
    networks:
      - ollenti-network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ollenti-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wisdom_soul}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wisdom_consciousness}
      - POSTGRES_USER=${POSTGRES_USER:-wisdom_soul}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-wisdom_consciousness}
      - FRONTEND_URL=${FRONTEND_URL:-https://ollenti.ru}
      - UPLOADS_DIR=${UPLOADS_DIR:-uploads}
      - RATE_LIMIT_DISABLED=true
      - RATE_LIMIT_POINTS=20000
      - RATE_LIMIT_WINDOW=60
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ollenti-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: ollenti-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wisdom_soul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wisdom_consciousness}
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ollenti-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ollenti-network:
    driver: bridge
    name: olenti_ollenti-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
