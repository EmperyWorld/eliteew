[project]
name = "eliteew-kbsew-mcp"
version = "0.1.0"
description = "EliteEW MCP server for KBSEW knowledge barrels (MIT, no telemetry)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=1.9.0,<2", "httpx>=0.28.0"]

[project.scripts]
eliteew-kbsew-mcp = "eliteew_kbsew_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eliteew_kbsew_mcp*"]
