# Dependabot: EliteEW npm (frontend), pip (stack0-api build context), GitHub Actions
version: 2
updates:
  - package-ecosystem: npm
    directory: /shared/web/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 15

  - package-ecosystem: pip
    directory: /docker/builders/stack0-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
