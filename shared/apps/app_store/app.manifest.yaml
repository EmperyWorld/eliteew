# EliteEW product app manifest
id: app_store
title: App Store
edition_default:
  cloud: true
  onprem: true
  client: false
requires:
  - auth
  - postgres
optional_runtime:
  kind: in_process
surfaces:
  desktop:
    app_component: AppStore
    icon: app-store
  api:
    prefixes:
      - /api/v1/desktop/store
      - /api/v1/desktop/installed
  jobs:
    queues: []
client:
  offline_capable: none
  remote_tools_allowlist: []
