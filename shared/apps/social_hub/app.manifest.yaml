# EliteEW product app manifest
id: social_hub
title: Social Hub
edition_default:
  cloud: true
  onprem: true
  client: false
requires:
  - auth
  - postgres
optional_runtime:
  kind: in_process
surfaces:
  desktop:
    app_component: SocialHubApp
    icon: app-social-hub
  api:
    prefixes:
      - /api/v1/friends
  jobs:
    queues: []
client:
  offline_capable: none
  remote_tools_allowlist: []
