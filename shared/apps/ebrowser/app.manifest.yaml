# EliteEW product app manifest
id: ebrowser
title: EBrowser
edition_default:
  cloud: true
  onprem: true
  client: true
requires:
  - auth
optional_runtime:
  kind: in_process
surfaces:
  desktop:
    app_component: EBrowserApp
    icon: app-ebrowser
  api:
    prefixes:
      - /api/v1/ebrowser
  jobs:
    queues: []
client:
  offline_capable: none
  remote_tools_allowlist: []
