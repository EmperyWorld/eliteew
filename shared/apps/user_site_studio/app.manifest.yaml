# EliteEW product app manifest
id: user_site_studio
title: Site Studio
edition_default:
  cloud: true
  onprem: true
  client: false
requires:
  - auth
  - postgres
optional_runtime:
  kind: in_process
surfaces:
  desktop:
    app_component: UserSiteStudio
    icon: app-site-studio
  api:
    prefixes:
      - /api/v1/desktop
  jobs:
    queues: []
client:
  offline_capable: none
  remote_tools_allowlist: []
