# EliteEW product app manifest
id: ewdesk
title: EWDesk News
edition_default:
  cloud: true
  onprem: true
  client: false
requires:
  - auth
  - postgres
optional_runtime:
  kind: in_process
surfaces:
  desktop:
    app_component: EWDeskApp
    icon: app-ewdesk
  api:
    prefixes:
      - /api/v1/product-desktop
  jobs:
    queues: []
client:
  offline_capable: none
  remote_tools_allowlist: []
