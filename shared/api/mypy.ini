[mypy]
python_version = 3.14
explicit_package_bases = True
namespace_packages = True
mypy_path = .
warn_unused_ignores = False
warn_return_any = False
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = (?x)(
    ^\.venv/
  | ^venv/
  | ^migrations/
  | ^tests/
  | ^comfyui/
  | ^generated_files/
  )
