<!-- EWASolution - Микроинтеракции и анимированные иконки -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Градиенты для интерактивных элементов -->
    <linearGradient id="hoverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="activeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>
    
    <!-- Эффекты для анимаций -->
    <filter id="ripple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Like / Нравится (анимированное сердце) -->
  <symbol id="icon-like" viewBox="0 0 24 24">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="#ef4444" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </symbol>

  <!-- Like Empty / Пустое сердце -->
  <symbol id="icon-like-empty" viewBox="0 0 24 24">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="#64748b" stroke-width="2" fill="none"/>
  </symbol>

  <!-- Bookmark / Закладка -->
  <symbol id="icon-bookmark" viewBox="0 0 24 24">
    <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z" fill="url(#hoverGradient)" opacity="0.8"/>
  </symbol>

  <!-- Bookmark Empty / Пустая закладка -->
  <symbol id="icon-bookmark-empty" viewBox="0 0 24 24">
    <path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z" stroke="#64748b" stroke-width="2" fill="none"/>
  </symbol>

  <!-- Star Rating / Звезда рейтинга -->
  <symbol id="icon-star-filled" viewBox="0 0 24 24">
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" fill="#fbbf24">
      <animate attributeName="fill" values="#fbbf24;#f59e0b;#fbbf24" dur="2s" repeatCount="indefinite"/>
    </path>
  </symbol>

  <!-- Star Empty / Пустая звезда -->
  <symbol id="icon-star-empty" viewBox="0 0 24 24">
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="#64748b" stroke-width="2" fill="none"/>
  </symbol>

  <!-- Hover Effect / Эффект наведения -->
  <symbol id="icon-hover-cursor" viewBox="0 0 24 24">
    <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" fill="url(#hoverGradient)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="scale" values="1;1.2;1" dur="0.3s" repeatCount="indefinite"/>
    </path>
  </symbol>

  <!-- Click Effect / Эффект клика -->
  <symbol id="icon-click-ripple" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8" fill="none" stroke="url(#activeGradient)" stroke-width="2" filter="url(#ripple)">
      <animate attributeName="r" values="0;8;12" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;0" dur="0.6s" repeatCount="indefinite"/>
    </circle>
  </symbol>

  <!-- Drag Handle / Перетаскивание -->
  <symbol id="icon-drag-handle" viewBox="0 0 24 24">
    <g fill="#64748b">
      <circle cx="8" cy="6" r="1.5"/>
      <circle cx="16" cy="6" r="1.5"/>
      <circle cx="8" cy="12" r="1.5"/>
      <circle cx="16" cy="12" r="1.5"/>
      <circle cx="8" cy="18" r="1.5"/>
      <circle cx="16" cy="18" r="1.5"/>
    </g>
  </symbol>

  <!-- Expand / Развернуть -->
  <symbol id="icon-expand" viewBox="0 0 24 24">
    <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" stroke="url(#hoverGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Collapse / Свернуть -->
  <symbol id="icon-collapse" viewBox="0 0 24 24">
    <path d="M8 3v3a2 2 0 01-2 2H3M16 3v3a2 2 0 002 2h3M8 21v-3a2 2 0 01-2-2H3M16 21v-3a2 2 0 002-2h3" stroke="url(#hoverGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Pulse / Пульсация -->
  <symbol id="icon-pulse" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="6" fill="url(#aiGradient)" opacity="0.6">
      <animate attributeName="r" values="6;8;6" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="12" r="3" fill="url(#aiGradient)"/>
  </symbol>

  <!-- Floating Action Button / Плавающая кнопка действий -->
  <symbol id="icon-fab" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#hoverGradient)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" dur="10s" values="0 12 12;360 12 12" repeatCount="indefinite"/>
    </circle>
    <path d="M12 8v8M8 12h8" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Toast Notification / Всплывающее уведомление -->
  <symbol id="icon-toast" viewBox="0 0 24 24">
    <rect x="3" y="6" width="18" height="12" rx="4" fill="url(#activeGradient)" opacity="0.9">
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3s" repeatCount="1"/>
    </rect>
    <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Loading Dots / Загрузочные точки -->
  <symbol id="icon-loading-dots" viewBox="0 0 24 24">
    <g fill="url(#hoverGradient)">
      <circle cx="6" cy="12" r="2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="12" cy="12" r="2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="18" cy="12" r="2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </symbol>

  <!-- Progress Ring / Кольцо прогресса -->
  <symbol id="icon-progress-ring" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="12" cy="12" r="9" fill="none" stroke="url(#activeGradient)" stroke-width="2" stroke-dasharray="56.55" stroke-dashoffset="42.41" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="56.55;0;56.55" dur="2s" repeatCount="indefinite"/>
    </circle>
  </symbol>

  <!-- Toggle Switch / Переключатель -->
  <symbol id="icon-toggle-on" viewBox="0 0 24 24">
    <rect x="3" y="8" width="18" height="8" rx="4" fill="url(#activeGradient)"/>
    <circle cx="17" cy="12" r="3" fill="white">
      <animateTransform attributeName="transform" type="translate" dur="0.3s" values="0,0;-10,0" repeatCount="1"/>
    </circle>
  </symbol>

  <!-- Toggle Switch Off / Переключатель выкл -->
  <symbol id="icon-toggle-off" viewBox="0 0 24 24">
    <rect x="3" y="8" width="18" height="8" rx="4" fill="#64748b"/>
    <circle cx="7" cy="12" r="3" fill="white"/>
  </symbol>
</svg>