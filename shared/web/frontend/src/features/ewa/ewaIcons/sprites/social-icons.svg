<!-- EWASolution - Социальные медиа иконки -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Социальные градиенты -->
    <linearGradient id="telegramGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0088cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229ed9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="whatsappGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25d366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#128c7e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="discordGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3c45a5;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="slackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a154b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#350d36;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="githubGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24292f;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="linkedinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005885;stop-opacity:1" />
    </linearGradient>
    
    <!-- Эффект свечения -->
    <filter id="socialGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Telegram -->
  <symbol id="icon-telegram" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#telegramGradient)" opacity="0.2"/>
    <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z" fill="url(#telegramGradient)"/>
  </symbol>

  <!-- WhatsApp -->
  <symbol id="icon-whatsapp" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#whatsappGradient)" opacity="0.2"/>
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z" fill="url(#whatsappGradient)"/>
  </symbol>

  <!-- Discord -->
  <symbol id="icon-discord" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#discordGradient)" opacity="0.2"/>
    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.010c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z" fill="url(#discordGradient)"/>
    <circle cx="8.5" cy="11.5" r="1.5" fill="white"/>
    <circle cx="15.5" cy="11.5" r="1.5" fill="white"/>
  </symbol>

  <!-- Slack -->
  <symbol id="icon-slack" viewBox="0 0 24 24">
    <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#slackGradient)" opacity="0.2"/>
    <path d="M8.7 13.3c0-.7-.6-1.3-1.3-1.3s-1.3.6-1.3 1.3v3.4c0 .7.6 1.3 1.3 1.3s1.3-.6 1.3-1.3v-3.4zm4-4c.7 0 1.3-.6 1.3-1.3s-.6-1.3-1.3-1.3H9.3c-.7 0-1.3.6-1.3 1.3S8.6 8.3 9.3 8.3h3.4zm-1.4 1.4c0-.7-.6-1.3-1.3-1.3s-1.3.6-1.3 1.3v3.4c0 .7.6 1.3 1.3 1.3s1.3-.6 1.3-1.3v-3.4zm4-4c0-.7-.6-1.3-1.3-1.3s-1.3.6-1.3 1.3v3.4c0 .7.6 1.3 1.3 1.3s1.3-.6 1.3-1.3V6.7z" fill="url(#slackGradient)"/>
  </symbol>

  <!-- GitHub -->
  <symbol id="icon-github" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#githubGradient)" opacity="0.2"/>
    <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill="url(#githubGradient)"/>
  </symbol>

  <!-- LinkedIn -->
  <symbol id="icon-linkedin" viewBox="0 0 24 24">
    <rect x="2" y="2" width="20" height="20" rx="2" fill="url(#linkedinGradient)" opacity="0.2"/>
    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" fill="url(#linkedinGradient)"/>
  </symbol>

  <!-- Email -->
  <symbol id="icon-email" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="14" rx="2" fill="#6366f1" opacity="0.2"/>
    <path d="M3 7l9 6 9-6" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="3" y="5" width="18" height="14" rx="2" stroke="#6366f1" stroke-width="2" fill="none"/>
  </symbol>

  <!-- Phone -->
  <symbol id="icon-phone" viewBox="0 0 24 24">
    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#6366f1" opacity="0.2"/>
  </symbol>

  <!-- Website -->
  <symbol id="icon-website" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="#6366f1" opacity="0.2"/>
    <path d="M3 12h18M12 3a9 9 0 000 18 9 9 0 000-18z" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M12 3c2.5 3.5 2.5 8.5 0 12M12 3c-2.5 3.5-2.5 8.5 0 12" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>