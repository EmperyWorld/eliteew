<!-- EWASolution - Accessibility & Доступность иконки -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Accessibility градиенты -->
    <linearGradient id="a11yGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="disabilityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="assistiveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    
    <!-- Эффекты для доступности -->
    <filter id="accessibilityGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Accessibility Universal / Универсальная доступность -->
  <symbol id="icon-accessibility" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#a11yGradient)" opacity="0.2"/>
    <circle cx="12" cy="12" r="10" stroke="url(#a11yGradient)" stroke-width="2" fill="none"/>
    
    <!-- Человек с доступностью -->
    <g stroke="url(#a11yGradient)" stroke-width="2" fill="none">
      <!-- Голова -->
      <circle cx="12" cy="7" r="1.5"/>
      <!-- Тело -->
      <path d="M12 10v6"/>
      <!-- Руки -->
      <path d="M9 13l6 0"/>
      <!-- Ноги -->
      <path d="M12 16l-2 3M12 16l2 3"/>
    </g>
  </symbol>

  <!-- Screen Reader / Программа чтения экрана -->
  <symbol id="icon-screen-reader" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="14" rx="2" fill="url(#assistiveGradient)" opacity="0.2"/>
    <rect x="3" y="4" width="18" height="14" rx="2" stroke="url(#assistiveGradient)" stroke-width="2" fill="none"/>
    
    <!-- Звуковые волны -->
    <g stroke="url(#assistiveGradient)" stroke-width="2" fill="none" opacity="0.7">
      <path d="M7 10 Q9 8 11 10">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M7 12 Q9 10 11 12">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M7 14 Q9 12 11 14">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <!-- Курсор чтения -->
    <rect x="13" y="9" width="6" height="1" fill="url(#assistiveGradient)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="13" y="11" width="4" height="1" fill="url(#assistiveGradient)" opacity="0.6"/>
    <rect x="13" y="13" width="5" height="1" fill="url(#assistiveGradient)" opacity="0.6"/>
  </symbol>

  <!-- High Contrast / Высокий контраст -->
  <symbol id="icon-high-contrast" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#disabilityGradient)" opacity="0.3"/>
    <circle cx="12" cy="12" r="10" stroke="url(#disabilityGradient)" stroke-width="2" fill="none"/>
    
    <!-- Половинки контраста -->
    <path d="M12 2 A10 10 0 0 0 12 22 z" fill="white"/>
    <path d="M12 2 A10 10 0 0 1 12 22 z" fill="#1f2937"/>
    
    <!-- Центральный индикатор -->
    <circle cx="12" cy="12" r="2" fill="url(#disabilityGradient)"/>
  </symbol>

  <!-- Large Text / Крупный текст -->
  <symbol id="icon-large-text" viewBox="0 0 24 24">
    <rect x="2" y="4" width="20" height="16" rx="2" fill="url(#a11yGradient)" opacity="0.1"/>
    
    <!-- Крупные буквы -->
    <g fill="url(#a11yGradient)" font-family="Arial, sans-serif" font-weight="bold">
      <text x="4" y="12" font-size="6">A</text>
      <text x="9" y="16" font-size="8">A</text>
      <text x="16" y="18" font-size="10">A</text>
    </g>
    
    <!-- Стрелки увеличения -->
    <g stroke="url(#a11yGradient)" stroke-width="1.5" fill="none">
      <path d="M20 8l-2-2M18 6h4v4"/>
    </g>
  </symbol>

  <!-- Voice Control / Голосовое управление -->
  <symbol id="icon-voice-control" viewBox="0 0 24 24">
    <g filter="url(#accessibilityGlow)">
      <!-- Микрофон -->
      <rect x="10" y="6" width="4" height="8" rx="2" fill="url(#assistiveGradient)" opacity="0.8"/>
      <path d="M8 12a4 4 0 008 0M12 18v4M10 22h4" stroke="url(#assistiveGradient)" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Звуковые волны -->
      <g stroke="url(#assistiveGradient)" stroke-width="2" fill="none" opacity="0.6">
        <path d="M6 10 Q4 12 6 14" stroke-linecap="round">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
        </path>
        <path d="M18 10 Q20 12 18 14" stroke-linecap="round">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </symbol>

  <!-- Sign Language / Язык жестов -->
  <symbol id="icon-sign-language" viewBox="0 0 24 24">
    <!-- Рука -->
    <g fill="url(#disabilityGradient)" opacity="0.8">
      <path d="M9 3v6h2V3c0-.6-.4-1-1-1s-1 .4-1 1zM11 6v6h2V6c0-.6-.4-1-1-1s-1 .4-1 1zM13 9v6h2V9c0-.6-.4-1-1-1s-1 .4-1 1zM15 12v3.5c0 .6.4 1 1 1s1-.4 1-1V12c0-.6-.4-1-1-1s-1 .4-1 1z"/>
      <path d="M7 9v4c0 2.8 2.2 5 5 5h4c1.1 0 2-.9 2-2v-1"/>
    </g>
    
    <!-- Движение -->
    <g stroke="url(#disabilityGradient)" stroke-width="1.5" fill="none" opacity="0.5">
      <path d="M18 8 Q20 6 22 8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </symbol>

  <!-- Keyboard Navigation / Клавиатурная навигация -->
  <symbol id="icon-keyboard-nav" viewBox="0 0 24 24">
    <rect x="2" y="8" width="20" height="10" rx="2" fill="url(#assistiveGradient)" opacity="0.2"/>
    <rect x="2" y="8" width="20" height="10" rx="2" stroke="url(#assistiveGradient)" stroke-width="2" fill="none"/>
    
    <!-- Клавиши -->
    <g fill="url(#assistiveGradient)" opacity="0.7">
      <rect x="4" y="10" width="2" height="2" rx="0.5"/>
      <rect x="7" y="10" width="2" height="2" rx="0.5"/>
      <rect x="10" y="10" width="2" height="2" rx="0.5"/>
      <rect x="13" y="10" width="2" height="2" rx="0.5"/>
      
      <rect x="5" y="13" width="3" height="2" rx="0.5"/>
      <rect x="9" y="13" width="6" height="2" rx="0.5"/>
      <rect x="16" y="13" width="3" height="2" rx="0.5"/>
    </g>
    
    <!-- Tab индикация -->
    <g stroke="url(#assistiveGradient)" stroke-width="1.5" fill="none">
      <path d="M17 11 L19 11 L18 10 M18 12 L19 11">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </symbol>

  <!-- Focus Indicator / Индикатор фокуса -->
  <symbol id="icon-focus-indicator" viewBox="0 0 24 24">
    <rect x="6" y="6" width="12" height="12" rx="2" fill="none" stroke="url(#a11yGradient)" stroke-width="3" stroke-dasharray="2,2">
      <animate attributeName="stroke-dashoffset" values="0;4" dur="1s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Внутренний элемент -->
    <rect x="8" y="8" width="8" height="8" rx="1" fill="url(#a11yGradient)" opacity="0.3"/>
    
    <!-- Углы фокуса -->
    <g stroke="url(#a11yGradient)" stroke-width="2" fill="none">
      <path d="M4 4 L6 4 L6 6"/>
      <path d="M20 4 L18 4 L18 6"/>
      <path d="M4 20 L6 20 L6 18"/>
      <path d="M20 20 L18 20 L18 18"/>
    </g>
  </symbol>

  <!-- Captions / Субтитры -->
  <symbol id="icon-captions" viewBox="0 0 24 24">
    <rect x="2" y="6" width="20" height="12" rx="2" fill="url(#disabilityGradient)" opacity="0.2"/>
    <rect x="2" y="6" width="20" height="12" rx="2" stroke="url(#disabilityGradient)" stroke-width="2" fill="none"/>
    
    <!-- Субтитры -->
    <g fill="url(#disabilityGradient)">
      <rect x="4" y="13" width="6" height="1" rx="0.5" opacity="0.8"/>
      <rect x="12" y="13" width="4" height="1" rx="0.5" opacity="0.8"/>
      <rect x="4" y="15" width="8" height="1" rx="0.5" opacity="0.6"/>
      <rect x="14" y="15" width="4" height="1" rx="0.5" opacity="0.6"/>
    </g>
    
    <!-- CC индикатор -->
    <g fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="6">
      <text x="6" y="11">CC</text>
    </g>
  </symbol>

  <!-- Motor Impairment / Двигательные нарушения -->
  <symbol id="icon-motor-assistance" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#assistiveGradient)" opacity="0.1"/>
    
    <!-- Специальный курсор -->
    <g fill="url(#assistiveGradient)">
      <circle cx="12" cy="12" r="4" opacity="0.3"/>
      <circle cx="12" cy="12" r="2" opacity="0.8">
        <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Направляющие линии -->
    <g stroke="url(#assistiveGradient)" stroke-width="1" opacity="0.4">
      <path d="M12 2 L12 22"/>
      <path d="M2 12 L22 12"/>
      <circle cx="12" cy="12" r="6" fill="none" stroke-dasharray="2,2"/>
    </g>
  </symbol>

  <!-- Seizure Safe / Безопасность при эпилепсии -->
  <symbol id="icon-seizure-safe" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="url(#a11yGradient)" opacity="0.2"/>
    <circle cx="12" cy="12" r="10" stroke="url(#a11yGradient)" stroke-width="2" fill="none"/>
    
    <!-- Стабильный центр -->
    <circle cx="12" cy="12" r="4" fill="url(#a11yGradient)" opacity="0.8"/>
    
    <!-- Медленные волны вместо мерцания -->
    <g stroke="url(#a11yGradient)" stroke-width="1" fill="none" opacity="0.5">
      <circle cx="12" cy="12" r="6">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="12" cy="12" r="8">
        <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Защитный символ -->
    <text x="12" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">!</text>
  </symbol>

  <!-- Dyslexia Friendly / Дружелюбный к дислексии -->
  <symbol id="icon-dyslexia-friendly" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="14" rx="2" fill="url(#disabilityGradient)" opacity="0.1"/>
    
    <!-- Специальный шрифт -->
    <g fill="url(#disabilityGradient)">
      <text x="6" y="12" font-family="Arial, sans-serif" font-size="6" font-weight="normal">Abc</text>
      <text x="14" y="12" font-family="Arial, sans-serif" font-size="6" font-weight="bold">ABC</text>
    </g>
    
    <!-- Направляющие линии -->
    <g stroke="url(#disabilityGradient)" stroke-width="0.5" opacity="0.4">
      <path d="M5 10 L19 10" stroke-dasharray="1,1"/>
      <path d="M5 14 L19 14" stroke-dasharray="1,1"/>
    </g>
  </symbol>

  <!-- Color Blind Safe / Безопасность для дальтоников -->
  <symbol id="icon-colorblind-safe" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" stroke="url(#a11yGradient)" stroke-width="2" fill="none"/>
    
    <!-- Безопасная палитра -->
    <g>
      <circle cx="8" cy="8" r="2" fill="#0066cc" opacity="0.8"/>
      <circle cx="16" cy="8" r="2" fill="#ffaa00" opacity="0.8"/>
      <circle cx="8" cy="16" r="2" fill="#009900" opacity="0.8"/>
      <circle cx="16" cy="16" r="2" fill="#cc0000" opacity="0.8"/>
    </g>
    
    <!-- Паттерны для различения -->
    <g stroke="white" stroke-width="1">
      <path d="M6 8 L10 8"/>
      <rect x="14.5" y="7.5" width="3" height="1"/>
      <circle cx="8" cy="16" r="1" fill="none"/>
      <path d="M14 14 L18 18 M18 14 L14 18"/>
    </g>
  </symbol>
</svg>