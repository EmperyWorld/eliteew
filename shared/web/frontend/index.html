<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Empery World" />
    <meta name="theme-color" content="#9dff00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/logo.webp" />
    <title>EliteEW</title>
    <link rel="stylesheet" href="/preloader.css" />
  </head>
  <body>
    <div id="app-preloader">
      <div class="preloader-card">
        <div class="preloader-logo">
          <div class="preloader-logo-inner">
            <div class="preloader-logo-mark"></div>
          </div>
        </div>
        <div class="preloader-title">EliteEW</div>
        <div class="preloader-progress-scale" aria-hidden="true">
          <span>0%</span>
          <span>100%</span>
        </div>
        <div class="preloader-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="99">
          <div class="preloader-progress-bar"></div>
        </div>
        <blockquote class="preloader-quote">
          <p class="preloader-quote-text">«Мы либо найдём дорогу, либо проложим её сами.»</p>
          <cite class="preloader-quote-author">Ганнибал</cite>
        </blockquote>
      </div>
    </div>
    <div id="root"></div>
    <!-- Before modules: Zod jitless so CSP without unsafe-eval does not report new Function probe -->
    <script src="/zod-csp-jitless.js"></script>
    <script type="module" src="/src/boot-dev-banner.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/elite-quotes-inline.js"></script>
    <script src="/preloader-fallback.js"></script>
  </body>
</html>
