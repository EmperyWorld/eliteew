packages:
  - "."
  # Wave K9: private @eliteew/* packages (SoT helpers; not npm-published).
  # Wave leftover: packages live under shared/packages/ (not EliteEW/).
  - "../../packages/*"

peerDependencyRules:
  allowedVersions:
    # Tooling uses tools/openapi-typescript-runtime (TS 5.x). Root SPA stays on typescript@7.
    openapi-typescript>typescript: "5 || 7"

allowBuilds:
  core-js: true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude: []

onlyBuiltDependencies:
  - canvas
  - core-js
  - esbuild
  - sharp

# Overrides live here (not only in package.json): pnpm applies workspace overrides reliably for this layout.
overrides:
  minimatch: ^10.2.6
  # Keep in lockstep with published motion-* line (framer-motion 13.4.4 → motion-dom ^13.4.4; motion-utils still 13.3.0).
  motion-dom: 13.4.4
  motion-utils: 13.3.0
  scheduler: ^0.27.0
  tar: ^7.5.22
  # axios: 1.16.1
  uuid: ^14.0.0
  glob: ^13.0.6
  archiver-utils>glob: ^13.0.6
  exceljs>archiver: 7.0.1
  exceljs>unzipper: 0.12.3
  postprocessing: 6.39.5
  lodash: 4.18.1
  lodash-es: 4.18.1
  dompurify@<3.3.2: ^3.3.2
  dompurify@<3.4.0: ^3.4.0
  dompurify@<=3.3.1: ^3.3.2
  dompurify@<=3.3.3: ^3.3.4
  dompurify@>=1.0.10 <3.4.0: ^3.4.0
  dompurify@>=3.0.1 <3.4.0: ^3.4.0
  dompurify@>=3.1.3 <=3.3.1: ^3.3.2
  # GHSA-cmwh-pvxp-8882 / GHSA-c2j3-45gr-mqc4 / GHSA-vxr8-fq34-vvx9 (monaco-editor → dompurify)
  dompurify@<=3.4.11: ^3.4.15
  dompurify: ^3.4.15
  lodash-es@<=4.17.23: ^4.17.24
  lodash-es@>=4.0.0 <=4.17.22: ^4.17.23
  lodash-es@>=4.0.0 <=4.17.23: ^4.17.24
  nanoid@<3.3.8: ^3.3.8
  nanoid@>=4.0.0 <5.0.9: ^5.0.9
  # GHSA-58qx-3vcg-4xpx + GHSA-96hv-2xvq-fx4p (engine.io-client → ws)
  ws: 8.21.3
minimumReleaseAge: 0
