# EliteEW · Empery World · https://eliteew.ru
# Author: po&T <keysray70@gmail.com>
# -----------------------------------------------------------------------------
# Purpose:
# SPA и reverse-proxy stack0 (/api/, WebSockets, OIDC-паттерны). CSI для [FEC]-лога: маркеры «\u{1b}» в шаблоне; образ копирует в /var/lib/nginx/runtime перед стартом (см. docker-entrypoint-csp.sh). FEC: remote/xff красятся по эффективному клиентскому IP (первый XFF или remote): LAN/loopback серым, РФ-публичный жёлтым, прочие публичные красным (RU IPv4 — geo из snippets/fe-ipv4-ru-zone.geo). Docker: access в /logs + tail в stderr.
# Invariants:
# - Bearer и Cookie в access log не включаются.
# - RU только IPv4-блок из ipdeny; IPv6-публичные без geo считаются «не РФ» (красный), кроме ULA/link-local ниже.
# - Static ``/assets`` has no ``Access-Control-Allow-Origin: *`` (same-origin SPA; no cross-origin asset CORS).
# - ``/deployment-manifest.json`` only for ops Host (127.0.0.1|localhost); public app Host → 404.
# Related:
# - docker/stack/stack0_f.yml; docker/builders/stack0-frontend/Dockerfile · nginx/snippets/fe-ipv4-ru-zone.geo
# - documentation/platform/FRONTEND-SECURITY-NGINX-STATIC.md
# -----------------------------------------------------------------------------
#
# ⚠️ Если запросы на /api/* приходят через хостовый nginx (например docker/host_conf/nginx-app-https.conf),
# там тоже нужен client_max_body_size ≥ 64–100M; иначе 413 до контейнерного nginx.

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ANSI CSI в лог: в шаблоне держим маркеры «\u{1b}» (6 ASCII-символов); stack0 entrypoint подменяет их на байт ESC до старта nginx (см. docker-entrypoint-csp.sh).
map $status $fe_paint_http {
    default "\u{1b}[37m";     # odd codes
    ~^[23]\d\d "\u{1b}[32m";  # 2xx / 3xx
    ~^[4]\d\d "\u{1b}[33m";   # 4xx
    ~^[5]\d\d "\u{1b}[1;31m"; # 5xx bold
}

# Эффективный клиент для раскраски FEC: первый IP из X-Forwarded-For, иначе $remote_addr.
map $http_x_forwarded_for $fe_geo_lookup_ip {
    ~^\s*([^,\s]+) $1;
    default $remote_addr;
}

# Приватный / локальный клиент → не «жёлтый внешний», не «красный Зарубеж».
map $fe_geo_lookup_ip $fe_is_internal_client {
    default 0;
    ~^127\. 1;
    ~^10\. 1;
    ~^172\.(1[6-9]|2[0-9]|3[0-1])\. 1;
    ~^192\.168\. 1;
    ~^169\.254\. 1;
    ~^100\.(6[4-9]|[789][0-9]|1[01][0-9]|12[0-7])\. 1;
    ~^[Ff][Ee]80: 1;
    ~^[Ff][Cc] 1;
    ~^[Ff][Dd] 1;
    ~^::1$ 1;
    ~^\[::1\] 1;
}

# RU IPv4 (ipdeny → snippets/fe-ipv4-ru-zone.geo). Публичный IPv6 без записи → default 0 (красный как «не РФ»).
geo $fe_geo_lookup_ip $fe_geo_ru_public {
    default 0;
    include /etc/nginx/snippets/fe-ipv4-ru-zone.geo;
}

# 10/11 — внутренние (серый); 01 — РФ публичный (жёлтый); 00 — публичный не-РФ (красный).
map $fe_is_internal_client$fe_geo_ru_public $fe_paint_client_ip {
    default "\u{1b}[91m";
    10 "\u{1b}[2;90m";
    11 "\u{1b}[2;90m";
    01 "\u{1b}[93m";
    00 "\u{1b}[91m";
}

# Хвост для прокси-запросов (отдельная строка в логе, см. ниже).
map $upstream_status $fe_upstream_tail {
    default '';
    "-"     '';
    ''      '';
    ~^[0-9] "\n    \u{1b}[2mupstream\u{1b}[0m │ rt=\u{1b}[36m$upstream_response_time\u{1b}[0m │ st=\u{1b}[35m$upstream_status\u{1b}[0m │ addr=$upstream_addr";
}

# Ops provenance curls use Host 127.0.0.1|localhost on :29001; public app Host must not serve the full manifest.
map $host $eliteew_ops_manifest_ok {
    default 0;
    127.0.0.1 1;
    localhost 1;
}

# Auth-proxy CORS: allowlist only (never * with credentials).
map $http_origin $eliteew_cors_origin {
    default "";
    "https://app.eliteew.ru" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
    "http://localhost:3000" $http_origin;
}

# Public probe / handshake rate limits (per client IP).
limit_req_zone $binary_remote_addr zone=eliteew_health:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=eliteew_socketio:10m rate=5r/s;

# stderr / tail: несколько строк на один HTTP-ответ (переносы \n), разделитель │ между полями.
log_format eliteew_frontend_docker escape=none "\u{1b}[2;90m[FEC]\u{1b}[0m \u{1b}[96m$time_iso8601\u{1b}[0m │ $fe_paint_client_ip$remote_addr\u{1b}[0m │ xff=$fe_paint_client_ip$http_x_forwarded_for\u{1b}[0m │ pref=\u{1b}[3m$http_x_auth_request_preferred_username\u{1b}[0m\n    req │ \u{1b}[1;37m$request\u{1b}[0m\n    rsp │ $fe_paint_http$status\u{1b}[0m │ bytes=\u{1b}[32m$body_bytes_sent\u{1b}[0m │ rt=\u{1b}[94m$request_time\u{1b}[0ms │ host=\u{1b}[90m$host\u{1b}[0m\n    ref │ \u{1b}[2m\"$http_referer\"\u{1b}[0m\n    ua │ \u{1b}[2m\"$http_user_agent\"\u{1b}[0m$fe_upstream_tail\n\u{1b}[2;90m────────────────────────────────────────────────────────────────\u{1b}[0m";

# Файл на volume (/logs/access.log): поля через ASCII ` | `; `$request` в кавычках как у `combined`.
log_format eliteew_frontend_file '$time_iso8601 | ip=$remote_addr | xff=$http_x_forwarded_for | "$request" | st=$status | bytes=$body_bytes_sent | rt_sec=$request_time | host=$host | pref=$http_x_auth_request_preferred_username | up_st=$upstream_status | up_rt=$upstream_response_time | up=$upstream_addr | ref=$http_referer | ua=$http_user_agent';

# OIDC provider auth.eliteew.ru (Keycloak stack6); опционально тот же шаблон для dev.
# Если туннель/роутинг ведёт auth на этот контейнер — проксируем через /auth-proxy/*

server {
    listen 8080;
    charset utf-8;
    # Access: plaintext в /logs/access.log + multiline ANSI в /logs/access-docker.log (tail в entrypoint → docker logs).

    access_log /logs/access.log eliteew_frontend_file;
    access_log /logs/access-docker.log eliteew_frontend_docker;
    error_log /logs/error.log notice;
    error_log /dev/stderr notice;
    # app.eliteew.ru — основной; 127.0.0.1 — когда запрос приходит через Cloudflare Tunnel / по IP
    # ⚠️ ВАЖНО: не используем `_` как wildcard, чтобы SPA не отвечало на eliteew.ru и другие домены.
    server_name app.eliteew.ru 127.0.0.1 localhost;
    # Шаблонный resolver: entrypoint заменяет его на nameserver из /etc/resolv.conf
    # (Docker: 127.0.0.11, Podman rootless: 10.89.x.1), чтобы /api/* и /socket.io не падали в 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ⚠️ ВАЖНО: Увеличен лимит для загрузки файлов (аватары, документы, аудио для транскрибации)
    # Base64 увеличивает размер на ~33%, поэтому 100MB позволяет загружать ~75MB оригинальных файлов
    client_max_body_size 100M;
    client_body_timeout 300s;
    send_timeout 300s;

    # Security headers: для ответов из location **без** своих add_header (прокси /api/*, /ws/, Keycloak /resources/ и т.д.).
    # Если в location есть **любой** add_header, nginx не наследует заголовки с уровня server — там подключается
    # include /etc/nginx/snippets/eliteew-security-headers.conf (см. статику, /auth-proxy CORS, /health).
    include /etc/nginx/snippets/eliteew-security-headers.conf;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Root directory
    root /usr/share/nginx/html;
    index index.html;

    # API proxy - Прямое проксирование на backend через Docker сеть
    # 🔥 ОПТИМИЗАЦИЯ: Frontend и Backend в одной Docker сети - проксируем напрямую
    # Это быстрее (нет лишних хопов), безопаснее (нет внешнего доступа), проще (меньше компонентов)
    # React SPA использует относительные пути /api/* → Frontend Nginx → Backend (stack0-eliteew-api-prod:8000)
    # Backend проверяет Bearer токены OIDC клиента (Authorization header)

    # Image Studio: загрузка изображений для редактирования (multipart), лимит как у /api/
    location ^~ /api/v1/image-studio/ {
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Access-Token $http_x_auth_request_access_token;
        proxy_set_header X-Auth-Request-Preferred-Username $http_x_auth_request_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
        client_max_body_size 100M;
    }

    # ⚠️ ОТДЕЛЬНЫЙ маршрут для картинок презентаций, чтобы 404 точно не перехватывался статиками
    location ^~ /api/v1/presentations/images/ {
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Access-Token $http_x_auth_request_access_token;
        proxy_set_header X-Auth-Request-Preferred-Username $http_x_auth_request_preferred_username;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
        client_max_body_size 100M;
    }

    # Local Service iframe proxy: HTML приходит из llama.cpp и содержит inline bootstrap script.
    # Держим исключение узким: только этот same-origin proxy path, без общего SPA CSP.
    location ^~ /api/v1/desktop/local-service-proxy/ {
        include /etc/nginx/snippets/eliteew-security-headers-base.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Rate-limited public health/version probes (must be before catch-all ^~ /api/)
    location = /api/health {
        limit_req zone=eliteew_health burst=20 nodelay;
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    location = /api/v1/health {
        limit_req zone=eliteew_health burst=20 nodelay;
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    location = /api/version {
        limit_req zone=eliteew_health burst=20 nodelay;
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Общий маршрут для всего остального /api/*
    # ⚠️ ВАЖНО: ^~ гарантирует, что /api/* НЕ перехватывается regex-локейшенами для статики (\\.png, \\.js и т.п.)
    location ^~ /api/ {
        # Проксируем на backend API
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔥 Передаем OAuth2 Proxy заголовки (установлены OAuth2 Proxy на уровне вышестоящего прокси)
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Access-Token $http_x_auth_request_access_token;
        proxy_set_header X-Auth-Request-Preferred-Username $http_x_auth_request_preferred_username;

        # 🔥 КРИТИЧНО: Также передаем Authorization header (для Bearer токенов OIDC)
        proxy_set_header Authorization $http_authorization;

        proxy_cache_bypass $http_upgrade;
        # ⚠️ Увеличены таймауты для загрузки файлов и длительных операций (транскрибация, генерация) - 30 минут
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        # Отключаем буферизацию для стримов
        proxy_buffering off;
        # ⚠️ Разрешаем большие файлы (включая base64-encoded аудио для транскрибации)
        client_max_body_size 100M;
    }

    # UGS generate endpoint - специальные таймауты для длительных операций (транскрибация, генерация)
    location /api/v1/ugs/generate {
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 🔥 Передаем OAuth2 Proxy заголовки (установлены OAuth2 Proxy)
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Access-Token $http_x_auth_request_access_token;
        proxy_set_header X-Auth-Request-Preferred-Username $http_x_auth_request_preferred_username;

        # 🔥 Передаем Authorization header (Bearer token)
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
        # 🔥 КРИТИЧНО: Увеличенные таймауты для транскрибации и генерации (30 минут)
        proxy_connect_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
        # 🔥 КРИТИЧНО: Увеличен лимит для base64-encoded аудио файлов (100MB = ~75MB оригинальных)
        client_max_body_size 100M;
    }

    # Legacy FastAPI `/ws*` echo soft-retired 2026-07-28 — do not re-add catch-all `location /ws/`.
    # Product realtime: `/socket.io/` + `/api/v1/live-voice/ws/` (+ Doc Yjs under `/api/`).

    # Socket.IO специфичный роутинг
    location /socket.io/ {
        limit_req zone=eliteew_socketio burst=10 nodelay;
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # Длинные таймауты для Socket.IO
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }

    # Live Voice WebSocket endpoint - real-time voice communication with AI
    location /api/v1/live-voice/ws/ {
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # КРИТИЧНО для аутентифицированных WebSocket (Bearer token в query параметре)
        proxy_set_header Authorization $http_authorization;
        # Передаем OAuth2 Proxy заголовки
        proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
        proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Access-Token $http_x_auth_request_access_token;
        proxy_set_header X-Auth-Request-Preferred-Username $http_x_auth_request_preferred_username;
        # Длинные таймауты для WebSocket (7 дней для постоянных соединений)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        # Отключаем буферизацию для WebSocket
        proxy_buffering off;
    }

    # Probe only: proxy to API GET /ws/health (dynamic timestamp; public allowlist).
    location = /ws/health {
        set $backend_api_host eliteew-api-prod;
        proxy_pass http://$backend_api_host:8000/ws/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # Keycloak proxy (optional dev/local path): /auth-proxy/* -> stack6-keycloak:8080.
    # Прод обычно ходит напрямую на issuer; маршрут нужен для localhost.same-origin сценариев.
    location ~ ^/auth-proxy/(.*)$ {
        set $oidc_host stack6-keycloak;
        proxy_pass http://$oidc_host:8080/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host auth.eliteew.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /auth-proxy;
        proxy_set_header X-Forwarded-Port 443;
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        # Reflect allowlisted Origin only (map $eliteew_cors_origin); never *.
        add_header Access-Control-Allow-Origin $eliteew_cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin" always;
        add_header Access-Control-Allow-Credentials true always;
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $eliteew_cors_origin always;
            add_header Vary Origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Legacy public APK URL → standalone download page (no desktop SPA)
    location = /download/empery-mobile.apk {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        return 302 https://app.eliteew.ru/mobile-app/;
    }

    # Standalone mobile APK page — isolated from hash SPA / desktop shell
    location = /mobile-app {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        return 301 /mobile-app/;
    }

    location /mobile-app/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /mobile-app/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Private desktop-client OTA (Tauri updater, Wave O2).
    # Client asks …/{{target}}/{{arch}}/{{current_version}} → rewrite to latest.json.
    # Artifacts live on host volume /srv/eliteew/desktop-client-updates (not SPA dist).
    location ~ ^/desktop-client-updates/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/[0-9][^/]*/?$ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        rewrite ^ /desktop-client-updates/latest.json last;
    }

    location /desktop-client-updates/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        alias /srv/eliteew/desktop-client-updates/;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # FoFline OTA channel (W4) — separate from vanilla desktop-client-updates.
    # Stage via scripts/eliteew/fofline-publish-update.sh; sync to /srv/eliteew/fofline-updates.
    location ~ ^/fofline-updates/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+/[0-9][^/]*/?$ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        rewrite ^ /fofline-updates/latest.json last;
    }

    location /fofline-updates/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        alias /srv/eliteew/fofline-updates/;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Legacy hash route bookmark → path-based standalone page
    location = /mobile-app-download-redirect.html {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        return 302 https://app.eliteew.ru/mobile-app/;
    }

    # Static assets - JavaScript, CSS, images, fonts
    # 🔥 КРИТИЧНО: Это должно быть ПЕРЕД общим location /, чтобы статические файлы не перехватывались SPA роутингом

    # JavaScript и TypeScript файлы (включая модули)
    location ~* \.(js|mjs|ts|tsx)$ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;
        # Content-Type один раз из mime.types; не add_header — иначе дубликат с upstream (warn в логе)

        # Кэширование статических файлов (с хешами в именах файлов)
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Отключаем логирование для статических файлов (опционально)
        access_log off;
    }

    # CSS файлы
    location ~* \.css$ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;

        # Кэширование статических файлов
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Отключаем логирование для статических файлов
        access_log off;
    }

    # Изображения
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;

        # Кэширование изображений
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Отключаем логирование для статических файлов
        access_log off;
    }

    # Шрифты
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;

        # Кэширование шрифтов
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Отключаем логирование для статических файлов
        access_log off;
    }

    # Assets директория (для совместимости)
    location /assets/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;

        # Правильные MIME типы для JavaScript модулей
        types {
            application/javascript js mjs;
            text/css css;
            image/svg+xml svg;
            image/png png;
            image/jpeg jpg jpeg;
            image/gif gif;
            image/webp webp;
            font/woff woff;
            font/woff2 woff2;
        }

        # Кэширование статических файлов (с хешами в именах файлов)
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Отключаем логирование для статических файлов (опционально)
        access_log off;
    }

    # Maintenance state: deploy menu writes this file before disruptive restarts.
    location = /maintenance-state.json {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /maintenance.html {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        try_files $uri /50x.html =503;
    }

    # Версия сборки: без кэша — long-lived вкладки опрашивают и делают reload после деплоя
    location = /app-build-version.txt {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location = /deployment-manifest.json {
        # Full provenance for ops on :29001 (Host 127.0.0.1|localhost only).
        # Public Host app.eliteew.ru → 404 (deploy_id remains on /app-build-version.txt).
        if ($eliteew_ops_manifest_ok = 0) {
            return 404;
        }
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # FoFline Linux OIDC bridge (WebKitGTK cannot follow HTTPS→fofline-spa: redirects).
    # Exact path only — missing look-alike must 404, never fall through to SPA index.html.
    # access_log off: defense-in-depth if a legacy query callback still hits this path;
    # FoFline auth uses response_mode=fragment so code/state are not in the request line.
    location = /fofline-oidc-bridge.html {
        access_log off;
        include /etc/nginx/snippets/eliteew-security-headers-base.conf;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        # Keep in sync with public/fofline-oidc-bridge.html inline script hash (Vitest lock).
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-p1ACBByB+igNHJPYOrmLXbRCVEtqM6cR0wpHU54V3fU='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Scanner / false-positive probes: do not SPA-fallback to index.html
    location = /env { return 404; }
    location = /swagger { return 404; }
    location = /swagger.json { return 404; }
    location = /nginx_status { return 404; }
    location = /runtime-config.json { return 404; }
    location = /__vite_ping { return 404; }
    location = /actuator { return 404; }
    location = /actuator/env { return 404; }
    location = /server-status { return 404; }

    # 🔥 КРИТИЧНО: index.html НЕ должен кэшироваться (всегда свежая версия)
    location = /index.html {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # FoFline / Desktop static packs — never SPA-fallback (missing file must stay 404).
    # Otherwise ProjectAbout iframe gets /index.html → desktop-in-desktop matryoshka.
    location ^~ /o-proekte/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ^~ /audio/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ^~ /ewa/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ^~ /desktop-wallpapers/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ^~ /avatars/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ^~ /site-studio-template-assets/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location ^~ /music-evolution/ {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # SPA routing - все запросы направляются на index.html для hash-based routing
    # 🔥 КРИТИЧНО: Это обеспечивает правильную работу SPA при обновлении страницы
    # ⚠️ ВАЖНО: location / должен быть ПОСЛЕ всех более специфичных location блоков
    location / {
        include /etc/nginx/snippets/eliteew-security-headers.conf;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # ✅ FIX: Убеждаемся, что index.html не кэшируется
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Error pages: do NOT serve index.html on 404 — missing .js/.css must stay 404
    # so the browser doesn't get HTML instead of script (avoids "404 when fetching the script").
    # SPA fallback is handled by location / with try_files $uri $uri/ /index.html.
    error_page 500 502 503 504 /maintenance.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
