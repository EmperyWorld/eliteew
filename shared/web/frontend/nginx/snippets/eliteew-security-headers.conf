# Полный набор для SPA-статики и прокси с CORS (см. eliteew-security-headers-base.conf).
include /etc/nginx/snippets/eliteew-security-headers-base.conf;
# CSP: строка генерируется при старте контейнера (docker-entrypoint-csp.sh) → /var/lib/nginx/csp/csp.conf
# (узкий connect-src/frame-src; ComfyUI LAN — CSP_CONNECT_EXTRA / CSP_FRAME_EXTRA в compose).
# Шаг 2–3: script-src 'self'; прелоадер — public/preloader-fallback.js + preloader.css.
# style-src 'unsafe-inline': runtime UI. img/media: базово self+data+blob; https:/LAN — CSP_IMG_EXTRA/CSP_MEDIA_EXTRA (entrypoint).
include /var/lib/nginx/csp/csp.conf;
